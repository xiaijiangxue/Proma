name: Build macOS ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/electron/**'
      - 'packages/**'
      - '.github/workflows/build-mac-arm64.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: oven-sh/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 打包 (macOS ARM64, 不发布)
        run: npx electron-builder --mac --arm64 --publish never
        working-directory: apps/electron

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Proma-macOS-ARM64
          path: apps/electron/out/*.dmg
          retention-days: 30
